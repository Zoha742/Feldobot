<!DOCTYPE html>
<html lang="bn"> 
<head>
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feldobot - Home</title>
    <!-- SDKs -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --bg: #050a18; --card: #121e36; --primary: #fbbf24; --text: #ffffff; --border: #1e2d4d; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; padding: 15px; padding-bottom: 80px; }
        
        .header { text-align: center; margin-bottom: 30px; padding-top: 10px; }
        .header h2 { margin: 0; font-size: 22px; color: var(--primary); font-weight: bold; }
        .header p { margin: 5px 0 0 0; font-size: 13px; color: #94a3b8; }

        .menu-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; max-width: 400px; margin: 0 auto; }
        .menu-card { 
            background: var(--card); border: 1.5px solid var(--border); border-radius: 14px; 
            padding: 25px 15px; text-align: center; cursor: pointer; transition: transform 0.2s, border-color 0.2s; 
        }
        .menu-card:active { transform: scale(0.95); }
        .menu-card:hover { border-color: var(--primary); }
        .menu-card i { font-size: 34px; color: var(--primary); margin-bottom: 12px; display: block; }
        .menu-card h3 { margin: 0; font-size: 16px; font-weight: bold; color: var(--text); }

        /* বটম নেভিগেশন */
        .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: #0f172a; border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 12px 0; z-index: 100; }
        .nav-item { text-align: center; color: #94a3b8; text-decoration: none; font-size: 12px; font-weight: 600; flex: 1; cursor: pointer; }
        .nav-item.active { color: var(--primary); }
        .nav-item i { font-size: 18px; display: block; margin-bottom: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>Feldobot HUB</h2>
            <p>Choose a category to explore</p>
        </div>

        <!-- ৪টি কার্ড (Player, Legend, Manager, Event) -->
        <div class="menu-grid">
            <div class="menu-card" onclick="openPage('player.html')">
                <i class="fa-solid fa-user-shield"></i>
                <h3>Player</h3>
            </div>
            <div class="menu-card" onclick="openPage('legend.html')">
                <i class="fa-solid fa-star"></i>
                <h3>Legend</h3>
            </div>
            <div class="menu-card" onclick="openPage('manager.html')">
                <i class="fa-solid fa-briefcase"></i>
                <h3>Manager</h3>
            </div>
            <div class="menu-card" onclick="openPage('event.html')">
                <i class="fa-solid fa-calendar-days"></i>
                <h3>Event</h3>
            </div>
        </div>
    </div>

    <!-- নেভিগেশন বার -->
    <div class="bottom-nav">
        <a class="nav-item active" href="index.html"><i class="fa-solid fa-house"></i>Home</a>
        <a class="nav-item" href="profile.html"><i class="fa-solid fa-user"></i>Profile</a>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // অ্যাড দেখিয়ে পেজে নিয়ে যাওয়ার ফাংশন
        function openPage(targetUrl) {
            if (window.Adsgram) {
                try {
                    const adController = window.Adsgram.init({ blockId: "29212" });
                    adController.show().then(() => {
                        window.location.href = targetUrl;
                    }).catch((err) => {
                        console.log("Ad skipped or failed:", err);
                        window.location.href = targetUrl; // অ্যাড ফেইল করলেও পেজে নিয়ে যাবে
                    });
                } catch (e) {
                    console.log("Adsgram init error:", e);
                    window.location.href = targetUrl;
                }
            } else {
                window.location.href = targetUrl;
            }
        }
    </script>
</body>
</html>
