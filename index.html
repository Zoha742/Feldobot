<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feldobot - Home</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Adsgram Official SDK Script -->
    <script src="https://sad.adsgram.ai/js/adsgram.js"></script>

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #38bdf8;
            --border-color: #334155;
        }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 0 0 80px 0; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 480px; padding: 16px; box-sizing: border-box; }
        .header { text-align: center; margin-bottom: 24px; padding-top: 10px; }
        .header h2 { margin: 0; font-size: 22px; font-weight: 700; color: var(--primary); }
        .header p { margin: 4px 0 0 0; font-size: 13px; color: var(--text-muted); }

        .menu-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-bottom: 20px; }
        .menu-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 24px 16px; text-align: center; cursor: pointer; transition: 0.3s; }
        .menu-card:active { transform: scale(0.97); background: #2a3eb1; }
        .menu-card i { font-size: 32px; color: var(--primary); margin-bottom: 12px; display: block; }
        .menu-card h3 { margin: 0; font-size: 16px; font-weight: 600; }

        /* বটম নেভিগেশন */
        .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: #1e293b; border-top: 1px solid var(--border-color); display: flex; justify-content: space-around; padding: 12px 0; z-index: 100; }
        .nav-item { text-align: center; color: var(--text-muted); text-decoration: none; font-size: 11px; font-weight: 600; flex: 1; cursor: pointer; }
        .nav-item.active { color: var(--primary); }
        .nav-item i { font-size: 18px; display: block; margin-bottom: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>⚡ Feldobot Hub</h2>
            <p>Explore Players, Legends, Managers & Events</p>
        </div>

        <!-- ৪টি ক্যাটাগরি কার্ড -->
        <div class="menu-grid">
            <div class="menu-card" onclick="openSection('player.html')">
                <i class="fa-solid fa-user-shield"></i>
                <h3>Player</h3>
            </div>
            <div class="menu-card" onclick="openSection('legend.html')">
                <i class="fa-solid fa-star"></i>
                <h3>Legend</h3>
            </div>
            <div class="menu-card" onclick="openSection('manager.html')">
                <i class="fa-solid fa-briefcase"></i>
                <h3>Manager</h3>
            </div>
            <div class="menu-card" onclick="openSection('event.html')">
                <i class="fa-solid fa-calendar-days"></i>
                <h3>Event</h3>
            </div>
        </div>
    </div>

    <!-- নেভিগেশন বার -->
    <div class="bottom-nav">
        <a class="nav-item active" href="index.html"><i class="fa-solid fa-house"></i>Home</a>
        <a class="nav-item" href="profile.html"><i class="fa-solid fa-user"></i>Profile</a>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        // Adsgram Controller (আপনার সচল প্ল্যাটফর্ম আইডি বা ব্লক আইডি এখানে বসাবেন)
        const adsgramController = window.Adsgram ? window.Adsgram.init({ blockId: "42824" }) : null;

        function openSection(targetPage) {
            if (adsgramController) {
                adsgramController.show()
                    .then(() => {
                        window.location.href = targetPage;
                    })
                    .catch((result) => {
                        console.log("Adsgram error:", result);
                        // অ্যাড না থাকলে বা এরর হলে সরাসরি পেজে নিয়ে যাবে
                        window.location.href = targetPage;
                    });
            } else {
                window.location.href = targetPage;
            }
        }
    </script>
</body>
</html>
