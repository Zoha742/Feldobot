<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legend Bio - Heyvo</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg: #050a18; --card: #121e36; --primary: #fbbf24; --text: #ffffff; --border: #1e2d4d; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; padding: 15px; }
        .header { display: flex; align-items: center; position: relative; margin-bottom: 20px; height: 40px; }
        .back-btn { position: absolute; left: 0; font-size: 22px; color: var(--primary); text-decoration: none; }
        .header h2 { width: 100%; text-align: center; font-size: 18px; color: var(--primary); margin: 0; }
        .bio-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 15px; text-align: center; }
        .bio-card img { width: 100%; max-height: 250px; object-fit: cover; border-radius: 8px; margin-bottom: 15px; }
        .bio-name { font-size: 18px; font-weight: bold; color: var(--primary); margin-bottom: 10px; }
        .bio-details { font-size: 14px; color: #cbd5e1; text-align: left; line-height: 1.6; }
    </style>
</head>
<body>

    <div class="header">
        <a href="legends.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
        <h2>LEGEND BIO</h2>
    </div>

    <div class="bio-card" id="bio-container">
        <p>Loading...</p>
    </div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const container = document.getElementById('bio-container');
    const data = localStorage.getItem('selected_legend');

    if (data) {
        const legend = JSON.parse(data);
        container.innerHTML = `
            <img src="${legend.img}" alt="${legend.name}">
            <div class="bio-name">${legend.name}</div>
            <div class="bio-details">${legend.bio || 'No details available.'}</div>
        `;
    } else {
        container.innerHTML = "<p>Legend data not found!</p>";
    }
</script>
</body>
</html>
