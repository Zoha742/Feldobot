<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Heyvo</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg: #050a18; --card: #121e36; --primary: #fbbf24; --text: #ffffff; --border: #1e2d4d; } 
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; padding: 15px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 480px; box-sizing: border-box; }
        
        .back-btn { background: none; border: none; color: var(--primary); font-size: 16px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 8px; margin-bottom: 15px; padding: 0; }
        
        .profile-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; text-align: center; }
        .profile-img { width: 90px; height: 90px; border-radius: 50%; object-fit: cover; border: 2px solid var(--primary); margin-bottom: 15px; background: #1e2d4d; }
        
        .name-container { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 5px; }
        .profile-name { font-size: 20px; font-weight: bold; color: var(--primary); margin: 0; }
        .edit-icon { color: var(--primary); cursor: pointer; font-size: 14px; }

        .edit-box { display: none; margin-bottom: 10px; gap: 5px; justify-content: center; }
        .edit-input { background: #050a18; border: 1px solid var(--border); color: var(--text); padding: 5px 10px; border-radius: 8px; font-size: 14px; outline: none; }
        .save-btn { background: var(--primary); border: none; color: #050a18; padding: 5px 10px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 12px; }

        .profile-username { font-size: 14px; color: #94a3b8; margin-bottom: 20px; }
        
        .info-box { background: #050a18; border: 1px solid var(--border); border-radius: 12px; padding: 15px; text-align: left; display: flex; flex-direction: column; gap: 10px; }
        .info-row { display: flex; justify-content: space-between; font-size: 14px; }
        .info-label { color: #94a3b8; }
        .info-value { color: var(--text); font-weight: 500; }
    </style>
</head>
<body>
    <div class="container">
        <button class="back-btn" onclick="history.back()"><i class="fa-solid fa-arrow-left"></i> Back</button>

        <div class="profile-card">
            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=500" class="profile-img" id="userAvatar" alt="Avatar">
            
            <div class="name-container">
                <h2 class="profile-name" id="userName">User Name</h2>
                <i class="fa-solid fa-pen edit-icon" onclick="toggleEdit()" title="Change Name"></i>
            </div>

            <div class="edit-box" id="editBox">
                <input type="text" id="nameInput" class="edit-input" placeholder="Enter new name">
                <button class="save-btn" onclick="saveName()">Save</button>
            </div>

            <p class="profile-username" id="userHandle">@username</p>
            
            <div class="info-box">
                <div class="info-row">
                    <span class="info-label">Telegram ID:</span>
                    <span class="info-value" id="userId">---</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Language:</span>
                    <span class="info-value" id="userLang">---</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let displayName = "User Name";

        // Telegram User Info Fetching & Local Storage Check
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            const user = tg.initDataUnsafe.user;
            const savedName = localStorage.getItem(`custom_name_${user.id}`);
            
            displayName = savedName || `${user.first_name} ${user.last_name || ''}`;
            document.getElementById('userHandle').innerText = user.username ? `@${user.username}` : 'No Username';
            document.getElementById('userId').innerText = user.id;
            document.getElementById('userLang').innerText = user.language_code ? user.language_code.toUpperCase() : 'EN';
            
            if (user.photo_url) {
                document.getElementById('userAvatar').src = user.photo_url;
            }
        } else {
            displayName = localStorage.getItem('custom_name_default') || "User Name";
        }

        document.getElementById('userName').innerText = displayName;

        function toggleEdit() {
            const editBox = document.getElementById('editBox');
            const nameInput = document.getElementById('nameInput');
            if (editBox.style.display === 'flex') {
                editBox.style.display = 'none';
            } else {
                editBox.style.display = 'flex';
                nameInput.value = document.getElementById('userName').innerText;
                nameInput.focus();
            }
        }

        function saveName() {
            const newName = document.getElementById('nameInput').value.trim();
            if (newName) {
                document.getElementById('userName').innerText = newName;
                
                // Save to LocalStorage based on Telegram User ID if available
                let userId = (tg.initDataUnsafe && tg.initDataUnsafe.user) ? tg.initDataUnsafe.user.id : 'default';
                localStorage.setItem(`custom_name_${userId}`, newName);
                
                document.getElementById('editBox').style.display = 'none';
            }
        }
    </script>
</body>
</html>
