<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Feldobot</title> 
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg: #050a18; --card: #121e36; --primary: #fbbf24; --text: #ffffff; --border: #1e2d4d; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; padding: 15px; padding-bottom: 80px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 480px; box-sizing: border-box; }
        
        .header { text-align: center; margin-bottom: 25px; padding-top: 10px; }
        .header h2 { margin: 0; font-size: 20px; color: var(--primary); font-weight: bold; }

        .profile-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 25px 20px; text-align: center; box-shadow: 0 8px 16px rgba(0,0,0,0.3); }
        .avatar { width: 75px; height: 75px; background: var(--primary); color: #050a18; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: bold; margin: 0 auto 20px auto; }
        
        .info-group { margin-bottom: 15px; text-align: left; background: #080e1e; padding: 12px 16px; border-radius: 10px; border: 1px solid var(--border); }
        .info-label { font-size: 11px; color: #94a3b8; text-transform: uppercase; font-weight: bold; margin-bottom: 4px; display: block; }
        .info-value { font-size: 15px; font-weight: bold; color: var(--text); }

        /* বটম নেভিগেশন */
        .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: #0f172a; border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 12px 0; z-index: 100; }
        .nav-item { text-align: center; color: #94a3b8; text-decoration: none; font-size: 12px; font-weight: 600; flex: 1; cursor: pointer; }
        .nav-item.active { color: var(--primary); }
        .nav-item i { font-size: 18px; display: block; margin-bottom: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>User Profile</h2>
        </div>

        <div class="profile-card">
            <div class="avatar" id="avatarInitial">U</div>
            
            <div class="info-group">
                <span class="info-label">Name</span>
                <div class="info-value" id="profileName">Loading...</div>
            </div>

            <div class="info-group" style="margin-bottom: 0;">
                <span class="info-label">Telegram ID</span>
                <div class="info-value" id="profileId">Loading...</div>
            </div>
        </div>
    </div>

    <!-- নেভিগেশন বার -->
    <div class="bottom-nav">
        <a class="nav-item" href="index.html"><i class="fa-solid fa-house"></i>Home</a>
        <a class="nav-item active" href="profile.html"><i class="fa-solid fa-user"></i>Profile</a>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let user = tg.initDataUnsafe.user;
        if (user) {
            let fullName = (user.first_name || "") + (user.last_name ? " " + user.last_name : "");
            document.getElementById('profileName').innerText = fullName || "Unknown User";
            document.getElementById('profileId').innerText = user.id || "N/A";
            document.getElementById('avatarInitial').innerText = (user.first_name ? user.first_name.charAt(0).toUpperCase() : "U");
        } else {
            document.getElementById('profileName').innerText = "Demo User";
            document.getElementById('profileId').innerText = "123456789";
            document.getElementById('avatarInitial').innerText = "D";
        }
    </script>
</body>
</html>
