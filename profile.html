<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feldobot - Profile</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #38bdf8;
            --border-color: #334155;
        }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 0 0 80px 0; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 480px; padding: 16px; box-sizing: border-box; }
        .header { text-align: center; margin-bottom: 24px; padding-top: 10px; }
        .header h2 { margin: 0; font-size: 20px; font-weight: 700; color: var(--primary); }

        .profile-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 24px; text-align: center; margin-bottom: 20px; box-shadow: 0 8px 16px rgba(0,0,0,0.2); }
        .avatar { width: 70px; height: 70px; background: var(--primary); color: #0f172a; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 700; margin: 0 auto 16px auto; }
        .info-group { margin-bottom: 14px; text-align: left; background: #0f172a; padding: 12px 16px; border-radius: 10px; border: 1px solid var(--border-color); }
        .info-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; font-weight: 600; margin-bottom: 2px; }
        .info-value { font-size: 15px; font-weight: 700; color: var(--text-main); }

        /* বটম নেভিগেশন */
        .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: #1e293b; border-top: 1px solid var(--border-color); display: flex; justify-content: space-around; padding: 12px 0; z-index: 100; }
        .nav-item { text-align: center; color: var(--text-muted); text-decoration: none; font-size: 11px; font-weight: 600; flex: 1; cursor: pointer; }
        .nav-item.active { color: var(--primary); }
        .nav-item i { font-size: 18px; display: block; margin-bottom: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>👤 User Profile</h2>
        </div>

        <div class="profile-card">
            <div class="avatar" id="avatarInitial">U</div>
            
            <div class="info-group">
                <div class="info-label">Telegram Name</div>
                <div class="info-value" id="profileName">Loading...</div>
            </div>

            <div class="info-group">
                <div class="info-label">Telegram ID</div>
                <div class="info-value" id="profileId">Loading...</div>
            </div>
        </div>
    </div>

    <!-- নেভিগেশন বার -->
    <div class="bottom-nav">
        <a class="nav-item" href="index.html"><i class="fa-solid fa-house"></i>Home</a>
        <a class="nav-item active" href="profile.html"><i class="fa-solid fa-user"></i>Profile</a>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let user = tg.initDataUnsafe.user;
        if (user) {
            let name = (user.first_name || "") + (user.last_name ? " " + user.last_name : "");
            document.getElementById('profileName').innerText = name || "Unknown User";
            document.getElementById('profileId').innerText = user.id || "N/A";
            document.getElementById('avatarInitial').innerText = (user.first_name ? user.first_name.charAt(0).toUpperCase() : "U");
        } else {
            document.getElementById('profileName').innerText = "Demo User";
            document.getElementById('profileId').innerText = "123456789";
            document.getElementById('avatarInitial').innerText = "D";
        }
    </script>
</body>
</html>
