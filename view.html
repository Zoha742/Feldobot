<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Details - Feldobot</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg: #050a18; --card: #121e36; --primary: #fbbf24; --text: #ffffff; --border: #1e2d4d; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; padding: 15px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 480px; box-sizing: border-box; }
        
        .back-btn { background: none; border: none; color: var(--primary); font-size: 16px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 8px; margin-bottom: 15px; padding: 0; }
        
        .detail-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; text-align: center; }
        .detail-img { width: 100%; height: 240px; object-fit: cover; border-radius: 12px; background: #1e2d4d; margin-bottom: 15px; }
        .detail-title { font-size: 20px; font-weight: bold; color: var(--primary); margin-bottom: 10px; }
        .detail-desc { font-size: 14px; color: #94a3b8; line-height: 1.5; margin-bottom: 20px; }
        
        .close-btn { background: var(--primary); color: #050a18; border: none; padding: 12px; border-radius: 10px; font-size: 15px; font-weight: bold; width: 100%; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <button class="back-btn" onclick="history.back()"><i class="fa-solid fa-arrow-left"></i> Back</button>

        <div class="detail-card">
            <img src="https://images.unsplash.com/photo-1517649763962-0c623066013b?w=500" class="detail-img" id="itemImg" alt="Image">
            <h2 class="detail-title" id="itemTitle">Item Details</h2>
            <p class="detail-desc" id="itemDesc">Here you can see all attributes and specifications of your selected item.</p>
            <button class="close-btn" onclick="tg.close()">Close App</button>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
    </script>
</body>
</html>
