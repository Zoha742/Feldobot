<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feldobot - Details View</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #38bdf8;
            --border-color: #334155;
        }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 16px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 480px; box-sizing: border-box; }
        
        .back-btn { background: none; border: none; color: var(--primary); font-size: 15px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; margin-bottom: 16px; padding: 0; }
        
        .detail-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 20px; text-align: center; }
        .detail-img { width: 100%; height: 220px; object-fit: cover; border-radius: 12px; background: #334155; margin-bottom: 16px; }
        .detail-title { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
        .detail-desc { font-size: 13px; color: var(--text-muted); line-height: 1.5; margin-bottom: 20px; }
        
        .action-btn { background: var(--primary); color: #0f172a; border: none; padding: 12px; border-radius: 10px; font-size: 14px; font-weight: 700; width: 100%; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <button class="back-btn" onclick="history.back()"><i class="fa-solid fa-arrow-left"></i> Back</button>

        <div class="detail-card">
            <img src="https://images.unsplash.com/photo-1517649763962-0c623066013b?w=500" class="detail-img" id="itemImg" alt="Image">
            <h2 class="detail-title" id="itemTitle">Item Details View</h2>
            <p class="detail-desc" id="itemDesc">Here you can see all detailed attributes, stats, and information regarding this selection.</p>
            <button class="action-btn" onclick="tg.close()">Close App</button>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
    </script>
</body>
</html>
